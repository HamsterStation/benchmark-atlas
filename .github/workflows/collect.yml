name: Collect arXiv paper drafts
on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只预览，不保存、不创建 PR、不发布'
        type: boolean
        default: true
      mode:
        description: '发布模式（auto 还需要 PAGES_ENABLED=true）'
        type: choice
        options: [review, auto]
        default: auto
permissions: {}
# All production writers share this lock, including state and deployment records.
concurrency:
  group: benchmark-atlas-production
  cancel-in-progress: false
jobs:
  collect:
    if: (github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true') && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    outputs:
      deploy_ready: ${{ steps.ready.outputs.deploy_ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ATLAS_WRITE_ENABLED: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      ATLAS_REMOTE_CHECKPOINTS: 'true'
      PUBLISH_MODE: ${{ inputs.mode || vars.PUBLISH_MODE || 'review' }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: npm ci
      - run: python -m pip install -r requirements.lock
      - name: Restore durable state
        id: restore
        run: python scripts/github_sync.py restore
      - name: Collect
        id: collect
        continue-on-error: true
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_URL: ${{ vars.MODEL_API_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_API_STREAM: ${{ vars.MODEL_API_STREAM || 'false' }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python -m collector.collect --dry-run --report work/collection-report.json
          else
            python -m collector.collect --report work/collection-report.json
          fi
      - name: Persist progress even after an API or model failure
        if: always() && steps.restore.outcome == 'success' && steps.collect.outcome != 'skipped' && env.DRY_RUN != 'true'
        run: python scripts/github_sync.py persist
      - name: Report
        if: always()
        run: |
          if [ -f work/collection-report.json ]; then
            python scripts/collection_report.py work/collection-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: collection-report
          path: work/collection-report.json
          if-no-files-found: warn
      - name: Fail closed after preserving the queue
        if: steps.collect.outcome == 'failure'
        run: exit 1
      - run: npm test
      - run: python -m unittest discover -s tests/python -v
      - run: npm run check
      - name: Build and check the standard repository subpath
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - name: Create or update one review PR
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'review'
        run: python scripts/github_sync.py review
      - name: Set actual Pages paths
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'auto' && vars.PAGES_ENABLED == 'true'
        run: python scripts/pages_env.py
      - name: Build auto content explicitly
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'auto' && vars.PAGES_ENABLED == 'true'
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'auto' && vars.PAGES_ENABLED == 'true'
        with:
          path: dist
      - id: ready
        if: env.DRY_RUN != 'true' && env.PUBLISH_MODE == 'auto' && vars.PAGES_ENABLED == 'true'
        run: echo 'deploy_ready=true' >> "$GITHUB_OUTPUT"
  deploy:
    needs: collect
    if: needs.collect.outputs.deploy_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
  record-deployment:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/github_sync.py deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_WRITE_ENABLED: 'true'
