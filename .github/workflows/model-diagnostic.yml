name: Diagnose model connection
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: benchmark-atlas-production
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ATLAS_WRITE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/github_sync.py restore
      - name: Make one budgeted model request without publishing
        run: python scripts/diagnose_model.py
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_URL: ${{ vars.MODEL_API_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_API_STREAM: ${{ vars.MODEL_API_STREAM || 'false' }}
      - name: Safe diagnostic summary
        if: always()
        run: |
          if [ -f work/model-diagnostic.json ]; then
            cat work/model-diagnostic.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: model-diagnostic
          path: work/model-diagnostic.json
          if-no-files-found: warn
