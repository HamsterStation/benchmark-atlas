name: Deploy reviewed site
on:
  push:
  workflow_dispatch:
permissions: {}
concurrency:
  group: benchmark-atlas-production
  cancel-in-progress: false
jobs:
  build:
    if: vars.PAGES_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements.lock
      - run: python scripts/github_sync.py restore
      - run: npm test
      - run: python -m unittest discover -s tests/python -v
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - run: python scripts/pages_env.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
  record-deployment:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/github_sync.py deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_WRITE_ENABLED: 'true'
